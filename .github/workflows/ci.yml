name: Validate application
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dailyfuel
          POSTGRES_PASSWORD: dailyfuel-test
          POSTGRES_DB: dailyfuel
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: 'true'
      SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgresql://dailyfuel:dailyfuel-test@localhost:5432/dailyfuel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python backend/manage.py collectstatic --noinput
      - run: python manage.py test --noinput
        working-directory: backend
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
